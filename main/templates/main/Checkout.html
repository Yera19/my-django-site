<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Оплата | TechStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; padding-top: 50px; font-family: sans-serif; }
        .checkout-card { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .method-btn { cursor: pointer; border: 2px solid #eee; padding: 15px; border-radius: 12px; margin-bottom: 10px; font-weight: bold; text-align: center; }
        .method-btn.active { border-color: #28a745; background: #f4fff6; color: #28a745; }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 checkout-card">
            <h3 class="text-center fw-bold mb-4">Оформление заказа</h3>
            <div id="summary" class="bg-light p-3 rounded mb-4"></div>

            <h6>Способ оплаты:</h6>
            <div class="method-btn active" id="m-card" onclick="setM('card')">💳 Карта</div>
            <div class="method-btn" id="m-credit" onclick="setM('credit')">🏦 Кредит / Рассрочка</div>

            <div class="mt-4">
                <input type="text" id="name" class="form-control mb-3" placeholder="Ваше имя">
                
                <div id="card-group">
                    <input type="text" id="card-num" class="form-control mb-3" placeholder="16 цифр карты" maxlength="16">
                </div>

                <div id="credit-group" style="display:none;">
                    <input type="text" id="phone" class="form-control mb-3" placeholder="WhatsApp номер (напр. +7707...)">
                    <label class="small fw-bold mb-1">Срок (месяцев):</label>
                    <select id="term" class="form-select mb-3">
                        <option value="3">3 месяца</option>
                        <option value="6">6 месяцев</option>
                        <option value="12">12 месяцев</option>
                        <option value="24">24 месяца</option>
                    </select>
                </div>
            </div>

            <button class="btn btn-success w-100 py-3 fw-bold mt-3 rounded-pill" onclick="sendToDB()">ПОДТВЕРДИТЬ</button>
            <a href="/" class="btn btn-link w-100 mt-2 text-decoration-none text-muted">Назад</a>
        </div>
    </div>
</div>

<script>
    let method = 'card';
    function setM(m) {
        method = m;
        document.querySelectorAll('.method-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('m-'+m).classList.add('active');
        document.getElementById('card-group').style.display = m==='card' ? 'block' : 'none';
        document.getElementById('credit-group').style.display = m==='credit' ? 'block' : 'none';
    }

    function getCart() {
        const cart = JSON.parse(localStorage.getItem('cart')) || [];
        let total = 0; let items = "";
        cart.forEach(i => { total += i.price * i.quantity; items += i.name + " (x" + i.quantity + "), "; });
        document.getElementById('summary').innerHTML = `<b>К оплате:</b> ${total} ₸`;
        return { total, items };
    }

    async function sendToDB() {
        const name = document.getElementById('name').value;
        if(!name) return alert("Введите имя!");
        const cart = getCart();

        let data = {
            name: name,
            products: cart.items,
            total: cart.total + " ₸",
            method: method === 'card' ? 'Карта' : 'Кредит/Рассрочка',
            phone: method === 'card' ? 'Не указан' : document.getElementById('phone').value,
            term: method === 'credit' ? document.getElementById('term').value : 0
        };

        if(method === 'card' && document.getElementById('card-num').value.length !== 16) return alert("Нужно 16 цифр карты!");

        const resp = await fetch('/create_order/', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });

        if(resp.ok) {
            alert("Заявка принята! Данные сохранены в базе.");
            localStorage.setItem('cart', '[]');
            window.location.href = '/';
        }
    }
    getCart();
</script>
</body>
</html>
