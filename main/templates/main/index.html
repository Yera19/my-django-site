<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>TechStore | Магазин электроники</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
        .navbar { background: #2b2d42; }
        .product-card { border-radius: 20px; border: none; transition: 0.3s; background: white; height: 100%; }
        .product-card:hover { transform: translateY(-10px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        
        /* Кнопки категорий */
        .category-btn { transition: 0.2s; border-width: 2px; }
        .category-btn.active { background-color: #2b2d42; color: white; border-color: #2b2d42; }

        /* Плавающая кнопка корзины */
        .btn-cart-float { position: fixed; bottom: 30px; right: 30px; width: 70px; height: 70px; border-radius: 50%; background: #ef233c; color: white; border: none; font-size: 28px; z-index: 1000; box-shadow: 0 5px 20px rgba(0,0,0,0.3); }

        /* Боковое меню корзины */
        #cart-sidebar { position: fixed; top: 0; right: -400px; width: 380px; height: 100%; background: white; transition: 0.4s; z-index: 1001; box-shadow: -10px 0 30px rgba(0,0,0,0.2); display: flex; flex-direction: column; }
        #cart-sidebar.active { right: 0; }
        .cart-header { background: #2b2d42; color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .cart-items { flex-grow: 1; overflow-y: auto; padding: 20px; }
        
        .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        .qty-controls { display: flex; align-items: center; gap: 12px; }
        .btn-qty { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #ddd; background: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-qty:hover { background: #f8f9fa; border-color: #bbb; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand fw-bold fs-3" href="/">🚀 TECH STORE</a>
            <a href="/about/" class="btn btn-outline-light rounded-pill px-4">📞 Связаться</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex flex-wrap gap-2 justify-content-center">
            <a href="/" class="btn btn-outline-dark rounded-pill px-4 category-btn {% if not request.GET.category %}active{% endif %}">
                Все товары
            </a>
            
            {% for cat in categories %}
            <a href="?category={{ cat.id }}" 
               class="btn btn-outline-dark rounded-pill px-4 category-btn {% if request.GET.category == cat.id|stringformat:'s' %}active{% endif %}">
                {{ cat.name }}
            </a>
            {% endfor %}
        </div>
    </div>

    <div class="container mt-5 pb-5">
        <div class="row">
            {% for p in products %}
            <div class="col-md-4 mb-4">
                <div class="card product-card p-3 text-center">
                    <img src="{{ p.image_url }}" class="card-img-top p-2" style="height: 180px; object-fit: contain;">
                    <div class="card-body">
                        <h5 class="fw-bold">{{ p.name }}</h5>
                        <p class="text-primary fw-bold fs-5">{{ p.price }} ₸</p>
                        <button class="btn btn-danger w-100 rounded-pill fw-bold" onclick="addToCart('{{ p.name }}', {{ p.price }})">В КОРЗИНУ</button>
                    </div>
                </div>
            </div>
            {% empty %}
            <div class="col-12 text-center mt-5">
                <h3>В этой категории пока нет товаров 📦</h3>
                <a href="/" class="btn btn-primary mt-3">Вернуться к покупкам</a>
            </div>
            {% endfor %}
        </div>
    </div>

    <button class="btn-cart-float" onclick="toggleCart()">🛒 <span id="badge-count" class="badge bg-dark" style="font-size: 14px; position: absolute; top: 0; right: 0;">0</span></button>

    <div id="cart-sidebar">
        <div class="cart-header">
            <h5 class="m-0 fw-bold">Ваша корзина</h5>
            <button class="btn-close btn-close-white" onclick="toggleCart()"></button>
        </div>
        <div class="cart-items" id="cart-content"></div>
        <div class="p-4 border-top">
            <div class="d-flex justify-content-between mb-3">
                <span class="h5 fw-bold">Итого:</span>
                <span id="total-sum" class="h5 fw-bold text-primary">0 ₸</span>
            </div>
            <button class="btn btn-success w-100 py-3 rounded-pill fw-bold fs-5" onclick="location.href='/checkout/'">ОФОРМИТЬ ЗАКАЗ</button>
        </div>
    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        function updateCartUI() {
            localStorage.setItem('cart', JSON.stringify(cart));
            const container = document.getElementById('cart-content');
            container.innerHTML = '';
            
            let total = 0;
            let totalItems = 0;

            cart.forEach((item, index) => {
                total += item.price * item.quantity;
                totalItems += item.quantity;
                container.innerHTML += `
                    <div class="cart-item">
                        <div style="width: 55%">
                            <div class="fw-bold small text-truncate">${item.name}</div>
                            <div class="text-muted small">${item.price} ₸</div>
                        </div>
                        <div class="qty-controls">
                            <button class="btn-qty" onclick="changeQuantity(${index}, -1)">-</button>
                            <span class="fw-bold">${item.quantity}</span>
                            <button class="btn-qty" onclick="changeQuantity(${index}, 1)">+</button>
                        </div>
                    </div>`;
            });

            document.getElementById('total-sum').innerText = total + ' ₸';
            document.getElementById('badge-count').innerText = totalItems;
        }

        function addToCart(name, price) {
            let found = cart.findIndex(i => i.name === name);
            if(found > -1) {
                cart[found].quantity += 1;
            } else {
                cart.push({name: name, price: price, quantity: 1});
            }
            updateCartUI();
            document.getElementById('cart-sidebar').classList.add('active');
        }

        function changeQuantity(index, delta) {
            cart[index].quantity += delta;
            if(cart[index].quantity < 1) {
                cart.splice(index, 1);
            }
            updateCartUI();
        }

        function toggleCart() {
            document.getElementById('cart-sidebar').classList.toggle('active');
        }

        updateCartUI();
    </script>
</body>
</html>
